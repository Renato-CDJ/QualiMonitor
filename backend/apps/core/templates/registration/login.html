<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | QualiMonitor</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d131a;color:#e9eef5;font:15px system-ui}main{width:min(390px,calc(100% - 32px));padding:30px;background:#151e28;border:1px solid #263443;border-radius:16px}h1{margin:0 0 8px}p{color:#91a1b2;line-height:1.5}form{display:flex;flex-direction:column;gap:14px}label{font-size:13px;color:#cdd8e3}input{margin-top:6px;width:100%;box-sizing:border-box;background:#0d131a;border:1px solid #344554;border-radius:8px;color:#fff;padding:12px}button{background:#66e0b1;border:0;border-radius:8px;padding:12px;font-weight:700;cursor:pointer}ul{color:#ff8c8c;padding-left:18px}</style></head><body><main><h1>QualiMonitor</h1><p>Entre para acessar a central operacional.</p>{% if form.errors %}<ul><li>Usuário ou senha inválidos.</li></ul>{% endif %}<form method="post">{% csrf_token %}<label>Usuário{{ form.username }}</label><label>Senha{{ form.password }}</label><input type="hidden" name="next" value="{{ next }}"><button type="submit">Entrar</button></form></main></body></html>
